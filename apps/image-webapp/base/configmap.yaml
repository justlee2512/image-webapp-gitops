apiVersion: v1
kind: ConfigMap
metadata:
  name: image-webapp-config
  labels:
    app.kubernetes.io/name: image-webapp
data:
  PORT: "3000"
  TRUST_PROXY: "true"
  COOKIE_SECURE: "false"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@example.com"
  SESSION_IDLE_TIMEOUT_MS: "900000"
  SESSION_TOUCH_AFTER_MS: "60000"
  MAX_ACCOUNTS: "5"
  MAX_FILE_SIZE_MB: "30"
  MAX_IMAGE_PIXELS: "80000000"
  DB_SCHEMA: "image_drive"
  DB_POOL_MAX: "5"
  DB_STATEMENT_TIMEOUT_MS: "120000"
  DB_QUERY_TIMEOUT_MS: "125000"
  MAX_CONCURRENT_UPLOADS: "2"
  MAX_CONCURRENT_DOWNLOADS: "4"
  MAX_UPLOAD_QUEUE: "25"
  MAX_DOWNLOAD_QUEUE: "100"
  THUMBNAIL_WIDTH: "520"
  THUMBNAIL_HEIGHT: "390"
  THUMBNAIL_QUALITY: "76"