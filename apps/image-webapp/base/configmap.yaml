apiVersion: v1
kind: ConfigMap
metadata:
  name: image-webapp-config
  labels:
    app.kubernetes.io/name: image-webapp
data:
  PORT: "3000"

  TRUST_PROXY: "true"
  COOKIE_SECURE: "false"
  SESSION_IDLE_TIMEOUT_MS: "900000"

  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@example.com"

  MAX_ACCOUNTS: "5"
  MAX_FILE_SIZE_MB: "30"

  MAX_PENDING_REQUESTS: "100"
  ACCOUNT_REQUEST_TTL_MS: "86400000"

  LOGIN_RATE_LIMIT_WINDOW_MS: "900000"
  LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "10"
  LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS: "100"

  REGISTER_RATE_LIMIT_WINDOW_MS: "3600000"
  REGISTER_RATE_LIMIT_MAX_ATTEMPTS: "5"
  REGISTER_IP_BLOCK_MS: "3600000"

  DB_SCHEMA: "image_drive"
  DB_POOL_MAX: "5"
  DB_STATEMENT_TIMEOUT_MS: "600000"

  MAX_CONCURRENT_UPLOADS: "1"
  MAX_CONCURRENT_DOWNLOADS: "2"
