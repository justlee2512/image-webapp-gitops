apiVersion: v1
kind: ConfigMap
metadata:
  name: image-webapp-config
  labels:
    app.kubernetes.io/name: image-webapp
data:
  PORT: "3000"
  TRUST_PROXY: "true"
  COOKIE_SECURE: "false"
  SESSION_IDLE_TIMEOUT_MS: "900000"
  MAX_ACCOUNTS: "5"
  MAX_FILE_SIZE_MB: "30"
  MAX_UPLOAD_FILES: "50"
  MAX_UPLOAD_TOTAL_MB: "1024"
  DB_SCHEMA: "image_drive"
  DB_POOL_MAX: "5"
  DB_STATEMENT_TIMEOUT_MS: "600000"
  MAX_CONCURRENT_UPLOADS: "1"
  MAX_CONCURRENT_DOWNLOADS: "2"
