apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-webapp
  labels:
    app.kubernetes.io/name: image-webapp
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: image-webapp

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: image-webapp

  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-webapp
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: image-webapp

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      # Chỉ bật phần này nếu GHCR image của anh đang để private.
      # imagePullSecrets:
      #   - name: ghcr-pull-secret

      containers:
        - name: image-webapp
          image: ghcr.io/justlee2512/image-webapp:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: image-webapp-config

            - secretRef:
                name: image-webapp-secret

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /live
              port: http
              scheme: HTTP

            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /live
              port: http
              scheme: HTTP

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
