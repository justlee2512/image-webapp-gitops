apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-webapp
  namespace: image-webapp
  labels:
    app.kubernetes.io/name: image-webapp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: image.chocomin.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: image-webapp
                port:
                  name: http
